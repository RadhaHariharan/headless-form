name: Bug report
description: Report something that isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/RadhaHariharan/headlesskit/issues) first to avoid duplicates.

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: Which package does this bug affect?
      options:
        - "@headlesskit/forms"
        - "@headlesskit/forms-react"
        - "@headlesskit/forms-react-native"
        - "@headlesskit/query-core"
        - "@headlesskit/query-persist-client-core"
        - "@headlesskit/query-async-storage-persister"
        - "@headlesskit/query-sync-storage-persister"
        - "@headlesskit/state-management"
        - "@headlesskit/state-management-toolkit"
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        A minimal code sample, or a link to a minimal reproduction repo/StackBlitz/CodeSandbox.
        Issues without a reproduction are much harder to fix and may be closed if more
        information isn't provided.
      render: tsx
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime/framework versions relevant to the bug (e.g. Node, React, browser).
      placeholder: |
        - Node: 20.11.0
        - React: 18.3.1
        - Browser: Chrome 126
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (screenshots, logs, related issues).
    validations:
      required: false
