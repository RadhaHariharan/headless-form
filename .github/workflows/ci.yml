name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here — it's read from the `packageManager` field in package.json
      # (pnpm@9.4.0). Specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r run typecheck

      - name: Lint all packages
        run: pnpm -r run lint

      - name: Test core
        run: pnpm --filter @headlesskit/forms run test

      - name: Test react
        run: pnpm --filter @headlesskit/forms-react run test

      - name: Test angular
        run: pnpm --filter @headlesskit/angular run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # No `version` here — read from `packageManager` in package.json (pnpm@9.4.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @headlesskit/forms run build

      - name: Build react
        run: pnpm --filter @headlesskit/forms-react run build

      - name: Size check
        run: npx size-limit
        working-directory: .
