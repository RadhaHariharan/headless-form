<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>headless-form — Vanilla Example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 540px; margin: 2rem auto; padding: 0 1rem; }
    input { display: block; width: 100%; padding: .5rem; margin: .5rem 0; border: 1px solid #ccc; border-radius: 4px; }
    input[data-invalid] { border-color: #e53e3e; }
    .error { color: #e53e3e; font-size: .875rem; margin-top: -.25rem; }
    button { padding: .5rem 1.5rem; background: #3182ce; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #stats { margin-top: 1rem; font-size: .875rem; color: #666; }
    #render-count { font-weight: bold; color: #3182ce; }
  </style>
</head>
<body>
  <h1>headless-form — Vanilla / Core</h1>
  <p>
    Subscriber-notification counter — updates only when state the UI cares about changes.
  </p>

  <form id="demo-form">
    <label for="name">Name</label>
    <input id="name" type="text" data-path="name" placeholder="Alice" />
    <div class="error" id="name-error"></div>

    <label for="email">Email</label>
    <input id="email" type="email" data-path="email" placeholder="alice@example.com" />
    <div class="error" id="email-error"></div>

    <button type="submit">Submit</button>
  </form>

  <div id="stats">
    Subscriber fired: <span id="render-count">0</span> time(s)
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
