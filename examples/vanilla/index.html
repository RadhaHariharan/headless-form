<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>headless-form — Docs</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f7f8fa;
      --border: #e5e7eb;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #3182ce;
      --accent-soft: #ebf4ff;
      --code-bg: #f3f4f6;
      --code-block-bg: #1e293b;
      --code-block-text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    aside {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1.25rem 0;
    }
    .brand {
      padding: 0 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: .5rem;
    }
    .brand h1 { font-size: 1.1rem; margin: 0; }
    .brand p { font-size: .8rem; color: var(--muted); margin: .25rem 0 0; }
    nav a {
      display: block;
      padding: .5rem 1.5rem;
      color: var(--text);
      text-decoration: none;
      font-size: .9rem;
      border-left: 3px solid transparent;
    }
    nav a:hover { background: var(--accent-soft); }
    nav a.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    nav a .num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: .4rem; }
    nav a.active .num { color: var(--accent); }

    /* ── Content ─────────────────────────────────────────────── */
    main {
      overflow-y: auto;
      padding: 2.5rem 3rem 5rem;
    }
    .content { max-width: 820px; margin: 0 auto; }
    .content h1 { font-size: 2rem; margin-top: 0; }
    .content h2 { font-size: 1.5rem; margin-top: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
    .content h3 { font-size: 1.2rem; margin-top: 2rem; }
    .content p, .content li { line-height: 1.7; }
    .content a { color: var(--accent); }
    .content table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .9rem; }
    .content th, .content td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; }
    .content th { background: var(--sidebar-bg); }
    .content code {
      background: var(--code-bg);
      padding: .15rem .4rem;
      border-radius: 4px;
      font-size: .85em;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
    }
    .content pre {
      background: var(--code-block-bg);
      color: var(--code-block-text);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: .85rem;
      line-height: 1.5;
    }
    .content pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .content blockquote {
      border-left: 4px solid var(--accent);
      margin: 1rem 0;
      padding: .5rem 1rem;
      background: var(--accent-soft);
      color: var(--text);
    }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .doc-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      gap: 1rem;
    }
    .doc-nav a {
      text-decoration: none;
      color: var(--accent);
      font-size: .9rem;
      padding: .5rem .75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .doc-nav a:hover { background: var(--accent-soft); }
    .doc-nav a.next { margin-left: auto; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>headless-form</h1>
      <p>Framework-agnostic form engine</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="content" id="content"></div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
