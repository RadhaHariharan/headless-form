<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>headless-form — React Example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #1a202c; }
    h2 { color: #2d3748; font-size: 1.1rem; margin-top: 2rem; }
    input, select { display: block; width: 100%; padding: .5rem; margin: .25rem 0; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 1rem; }
    input[data-invalid="true"], select[data-invalid="true"] { border-color: #e53e3e; }
    .error { color: #e53e3e; font-size: .8125rem; min-height: 1.2em; }
    .badge { display: inline-block; background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; border-radius: 9999px; padding: 0 .6rem; font-size: .75rem; margin-left: .5rem; }
    .badge.uncontrolled { background: #f0fff4; color: #276749; border-color: #c6f6d5; }
    button { padding: .5rem 1.5rem; background: #3182ce; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .section { border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
    pre { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: .75rem; font-size: .8125rem; overflow: auto; }
    .row { display: flex; gap: 1rem; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
