<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeadlessKit — Documentation</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>◈</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">
            headlesskit
          </span>
        </a>

        <button id="package-switcher" class="package-switcher" aria-haspopup="listbox" aria-expanded="false">
          <span class="package-switcher-label">
            <span class="package-switcher-dot"></span>
            <span id="package-switcher-name">All packages</span>
          </span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div id="package-menu" class="package-menu" role="listbox" hidden></div>

        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input type="search" id="search" placeholder="Search docs…" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <nav id="nav"></nav>
    </aside>

    <div id="overlay"></div>

    <div id="main-wrapper">
      <header id="topbar">
        <button id="menu-btn" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <span id="breadcrumb"></span>
      </header>

      <div id="content-wrapper">
        <main id="content"></main>
        <aside id="toc-panel">
          <div class="toc-label">On this page</div>
          <nav id="toc"></nav>
        </aside>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
